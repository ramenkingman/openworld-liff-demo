<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>OpenWorld 会員証</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #f0f0f0;
    }

    .card-container {
      position: relative;
      max-width: 430px;
      margin: 0 auto;
    }

    .card-bg {
      width: 100%;
      display: block;
    }

    .card-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 20px;
      box-sizing: border-box;
      color: #000;
      text-shadow: 1px 1px 2px #fff;
    }

    .card-overlay h1 {
      font-size: 20px;
      margin: 10px 0;
      font-weight: bold;
    }

    .info-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .info-text {
      flex: 1;
    }

    .info-text p {
      margin: 5px 0;
      font-size: 16px;
    }

    .profile-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="card-container">
    <img
      class="card-bg"
      src="https://firebasestorage.googleapis.com/v0/b/openworld-liff.firebasestorage.app/o/S__25624874_0.jpg?alt=media&token=795d38e8-dac6-4942-8b05-535384f8f81a"
      alt="背景画像"
    />
    <div class="card-overlay">
      <h1>OpenWorld 会員証</h1>
      <div class="info-row">
        <div class="info-text">
          <p id="serial">会員証 No: 取得中...</p>
          <p id="name">名前: 取得中...</p>
          <p id="timestamp">登録日時: 取得中...</p>
        </div>
        <img id="profileImg" class="profile-img" src="" alt="プロフィール画像">
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      doc,
      runTransaction,
      query,
      where,
      getDocs,
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDwqG7to68d7O9KQ2EPWaUD1UFm_Cq9HXo",
      authDomain: "openworld-liff.firebaseapp.com",
      projectId: "openworld-liff",
      storageBucket: "openworld-liff.appspot.com",
      messagingSenderId: "79997022356",
      appId: "1:79997022356:web:89e7081d808bc5fc418481",
      measurementId: "G-SRK6BVFDYN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function main() {
      await liff.init({ liffId: "2007741116-ljZP4eGp" });

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      const profile = await liff.getProfile();
      const userId = profile.userId;

      const membersRef = collection(db, "members");
      const q = query(membersRef, where("userId", "==", userId));
      const snapshot = await getDocs(q);

      if (snapshot.empty) {
        const countersDocRef = doc(db, "counters", "members");

        await runTransaction(db, async (transaction) => {
          const counterDoc = await transaction.get(countersDocRef);
          let newSerial = 1;
          if (counterDoc.exists()) {
            const data = counterDoc.data();
            newSerial = (data.lastSerial || 0) + 1;
          } else {
            transaction.set(countersDocRef, { lastSerial: 0 });
          }

          transaction.update(countersDocRef, { lastSerial: newSerial });

          const newMemberRef = doc(membersRef);
          transaction.set(newMemberRef, {
            userId: userId,
            displayName: profile.displayName,
            pictureUrl: profile.pictureUrl,
            registeredAt: new Date(),
            memberNo: newSerial,
          });
        });
      }

      const allDocs = await getDocs(query(collection(db, "members"), where("userId", "==", userId)));
      if (allDocs.empty) {
        alert("ユーザー情報が見つかりません");
        return;
      }

      const userDoc = allDocs.docs[0];
      const data = userDoc.data();

      document.getElementById("serial").innerText =
        `会員証 No: #${String(data.memberNo).padStart(4, "0")}`;
      document.getElementById("name").innerText = `名前: ${data.displayName}`;
      document.getElementById("timestamp").innerText =
        `登録日時: ${data.registeredAt ? new Date(data.registeredAt.seconds * 1000).toLocaleString() : "不明"}`;
      document.getElementById("profileImg").src =
        data.pictureUrl || profile.pictureUrl;
    }

    main();
  </script>
</body>
</html>
