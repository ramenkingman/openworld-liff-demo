<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>OpenWorld 会員証</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- フォント -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Krona+One&display=swap" rel="stylesheet">

  <style>
    :root{
      --panel-radius: 18px;
      --label-value-gap: 12px;
      /* 3か所の余白を揃える基準値 */
      --space: 24px;
      --avatar-overlap: 56px;
      /* 見た目を揃えるための補正値 */
      --logo-adjust: 6px;   /* ロゴは小さく見えるので少し余白を増やす */
      --card-adjust: -4px;  /* カードは大きめなので少し余白を減らす */
    }

    *{ box-sizing: border-box; }
    body{
      margin:0;
      font-family: system-ui, sans-serif;
      color:#fff;
      min-height:100svh;
      background: radial-gradient(1200px 700px at 50% -200px, #7a7a7a 0%, #535353 40%, #2e2e2e 100%);
      background-attachment: fixed;
      display:flex; justify-content:center; align-items:flex-start;
    }
    .container{
      width:100%;
      max-width:460px;
      padding: var(--space) 16px 100px;
      position:relative;
    }

    /* ロゴ */
    .logo{
      width:clamp(280px, 75vw, 420px);
      height:auto;
      display:block;
      pointer-events:none;
      user-select:none;
      margin: 0 0 calc(var(--space) + var(--logo-adjust));
    }

    /* 上部カード */
    .hero-card{
      position:relative;
      width:100%;
      aspect-ratio:16/9;
      border-radius:16px;
      overflow:hidden;
      background:#000;
      box-shadow: 0 18px 50px rgba(0,0,0,.38),
                  0  8px 20px rgba(0,0,0,.32),
                  0  2px  6px rgba(0,0,0,.25);
      margin-bottom: calc(var(--space) + var(--card-adjust) + var(--avatar-overlap));
    }
    .hero-card img{
      width:100%; height:100%;
      object-fit:cover; display:block;
      border-radius:inherit;
    }

    /* プロフィール */
    .profile-stack{ position:relative; }
    .avatar{
      position:absolute;
      inset: calc(-1 * var(--avatar-overlap)) 0 auto 50%;
      transform:translateX(-50%);
      width:96px; height:96px; border-radius:50%;
      border:2px solid #ccc;
      background:#222; object-fit:cover;
      box-shadow:0 8px 18px rgba(0,0,0,.4);
      z-index:2;
    }

    /* 情報カード */
    .info-card{
      position:relative; z-index:1;
      padding:24px 22px;
      border-radius:var(--panel-radius);
      border:2px solid transparent;
      background:
        linear-gradient(160deg, #1a1a1a 0%, #0f0f0f 60%, #1e1e1e 100%) padding-box,
        linear-gradient(90deg, #f0f0f0 0%, #d3d3d3 35%, #2a2a2a 100%) border-box;
      background-clip: padding-box, border-box;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05),
                  0 18px 38px rgba(0,0,0,.5);
      overflow:hidden;
    }

    /* 行 */
    .row{ margin:22px 0; }

    /* ラベル Krona One */
    .label{
      display:block;
      text-align:left;
      font-family: "Krona One", sans-serif;
      font-size:17px;
      font-weight:400;
      color:#eaeaea;
      margin-bottom: var(--label-value-gap);
    }

    /* 値 Inter（細め） */
    .value{
      display:block;
      text-align:right;
      font-family: "Inter", sans-serif;
      font-size:17px;
      font-weight:400;
      color:#fff;
    }

    @media (max-width:360px){
      :root{
        --label-value-gap: 14px;
        --space: 20px;
        --avatar-overlap: 48px;
        --logo-adjust: 4px;
        --card-adjust: -2px;
      }
      .container{ padding: calc(var(--space) + 20px) 12px 80px; }
      .avatar{ width:86px; height:86px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img id="logo" class="logo" alt="Logo">

    <div class="hero-card">
      <img id="heroImg" alt="Membership Card">
    </div>

    <div class="profile-stack">
      <img id="avatar" class="avatar" alt="Profile">
      <div class="info-card">
        <div class="row">
          <div class="label">Member ID</div>
          <div id="serialValue" class="value">#00000</div>
        </div>
        <div class="row">
          <div class="label">Name</div>
          <div id="nameValue" class="value">—</div>
        </div>
        <div class="row">
          <div class="label">Join Date</div>
          <div id="dateValue" class="value">—</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import { getFirestore, collection, doc, runTransaction, query, where, getDocs, Timestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    const LOGO_URL = "https://firebasestorage.googleapis.com/v0/b/openworld-liff.firebasestorage.app/o/Header.png?alt=media&token=44229293-82db-4a55-bef3-c656bb9e7845";
    const CARD_IMAGE_URL = "https://firebasestorage.googleapis.com/v0/b/openworld-liff.firebasestorage.app/o/Group%205.png?alt=media&token=d9d885a4-7dd5-4a21-8bc0-ec248a39d3a2";

    const firebaseConfig = {
      apiKey: "AIzaSyDwqG7to68d7O9KQ2EPWaUD1UFm_Cq9HXo",
      authDomain: "openworld-liff.firebaseapp.com",
      projectId: "openworld-liff",
      storageBucket: "openworld-liff.appspot.com",
      messagingSenderId: "79997022356",
      appId: "1:79997022356:web:89e7081d808bc5fc418481",
      measurementId: "G-SRK6BVFDYN"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("logo").src = LOGO_URL;
    document.getElementById("heroImg").src = CARD_IMAGE_URL;

    const pad5 = n => String(n ?? 0).padStart(5,"0");
    const fmtYMD = d => {
      const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
      return `${y}/${m}/${day}`;
    };

    function toDateMaybe(ts){
      if (!ts) return null;
      if (ts instanceof Date) return ts;
      if (typeof ts==="string"){ const d=new Date(ts); return isNaN(d)?null:d; }
      if (typeof ts==="object" && "seconds" in ts){ return new Date(ts.seconds*1000); }
      try{ return Timestamp.fromDate(ts).toDate(); }catch{ return null; }
    }

    async function main(){
      await liff.init({ liffId:"2007741116-ljZP4eGp" });
      if(!liff.isLoggedIn()){ liff.login(); return; }

      const profile = await liff.getProfile();
      const userId = profile.userId;

      const membersRef = collection(db,"members");
      const qExist = query(membersRef, where("userId","==", userId));
      const existSnap = await getDocs(qExist);

      if(existSnap.empty){
        const counterRef = doc(db,"counters","members");
        await runTransaction(db, async(tx)=>{
          const c=await tx.get(counterRef);
          let last=0;
          if(!c.exists()) tx.set(counterRef,{ lastSerial:0 });
          else last=c.data().lastSerial||0;

          const newSerial=last+1;
          tx.update(counterRef,{ lastSerial:newSerial });

          const newMemberRef=doc(membersRef);
          tx.set(newMemberRef,{
            userId,
            displayName: profile.displayName??"",
            pictureUrl: profile.pictureUrl??"",
            registeredAt:new Date(),
            memberNo:newSerial,
          });
        });
      }

      const snap=await getDocs(query(membersRef, where("userId","==", userId)));
      if(snap.empty){ alert("ユーザー情報が見つかりません"); return; }
      const data=snap.docs[0].data();

      document.getElementById("serialValue").textContent=`#${pad5(data.memberNo)}`;
      document.getElementById("nameValue").textContent=data.displayName ?? profile.displayName ?? "—";
      const d=toDateMaybe(data.registeredAt);
      document.getElementById("dateValue").textContent=d?fmtYMD(d):"—";

      document.getElementById("avatar").src=(data.pictureUrl || profile.pictureUrl || "");
    }

    main().catch(e=>{
      console.error(e);
      alert("初期化に失敗しました。LINEアプリ内で開いているか確認してください。");
    });
  </script>
</body>
</html>
