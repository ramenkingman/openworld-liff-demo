<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>LIVE DAO Membership</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: linear-gradient(180deg, #2e2e2e, #1a1a1a);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      color: white;
    }
    .container {
      width: 100%;
      max-width: 430px;
      padding: 20px;
      box-sizing: border-box;
      position: relative;
    }

    /* ロゴ */
    .logo {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 150px;
    }

    /* メンバーシップカード */
    .card {
      background: url("https://firebasestorage.googleapis.com/v0/b/openworld-liff.firebasestorage.app/o/Card.png?alt=media&token=2b4be783-84b7-4dd7-aed1-199d0172617c")
        no-repeat center/cover;
      border-radius: 15px;
      height: 150px;
      margin: 80px 0 40px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    }

    /* プロフィール画像 */
    .profile {
      display: flex;
      justify-content: center;
      margin-top: -40px;
      margin-bottom: 20px;
    }
    .profile img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 4px solid #fff;
      object-fit: cover;
    }

    /* 情報カード */
    .info {
      background: linear-gradient(180deg, #3a3a3a, #1e1e1e);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.5);
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }
    .info-row span {
      font-weight: bold;
      color: #ddd;
    }
    .info-row p {
      margin: 0;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 左上のロゴ -->
    <img class="logo" src="https://firebasestorage.googleapis.com/v0/b/openworld-liff.firebasestorage.app/o/Header.png?alt=media&token=44229293-82db-4a55-bef3-c656bb9e7845" alt="Logo">

    <!-- カード -->
    <div class="card"></div>

    <!-- プロフィール -->
    <div class="profile">
      <img src="https://firebasestorage.googleapis.com/v0/b/openworld-liff.firebasestorage.app/o/sample-profile.png?alt=media" alt="Profile">
    </div>

    <!-- 情報 -->
    <div class="info">
      <div class="info-row">
        <span>Member ID</span>
        <p># 00001</p>
      </div>
      <div class="info-row">
        <span>Name</span>
        <p>Kazuki Abe</p>
      </div>
      <div class="info-row">
        <span>Join Date</span>
        <p>2025/01/01</p>
      </div>
    </div>
  </div>
</body>
</html>
