<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>OpenWorld 会員証</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- フォント：ラベル=Poppins / 値=Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --panel-radius: 18px;
      --label-size: 18px;
      --value-size: 17px;
      --row-gap:   20px;
      --pad-x:     24px;
      --pad-y:     26px;
    }
    *{ box-sizing: border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color:#fff;
      min-height:100svh;
      background: radial-gradient(1200px 700px at 50% -200px, #7a7a7a 0%, #535353 40%, #2e2e2e 100%);
      background-attachment: fixed;
      display:flex; justify-content:center; align-items:flex-start;
    }
    .container{
      width:100%;
      max-width:460px;
      padding:120px 16px 88px; /* ロゴを大きくした分、上の余白を広めに */
      position:relative;
    }

    /* 左上ロゴ（大きめ） */
    .logo{
      position:absolute;
      top:22px; left:20px;
      width:clamp(260px, 68vw, 340px);
      height:auto;
      display:block;
      pointer-events:none; user-select:none;
    }

    /* 上部カード画像 */
    .hero-card{
      position:relative;
      width:100%;
      aspect-ratio:16/9;
      border-radius:16px;
      overflow:hidden;
      margin-bottom:96px;           /* カードとプロフィールの距離をしっかり確保 */
      background:#000;
      box-shadow:
        0 18px 50px rgba(0,0,0,.38),
        0  8px 20px rgba(0,0,0,.32),
        0  2px  6px rgba(0,0,0,.25);
    }
    .hero-card::after{
      content:"";
      position:absolute; inset:0;
      border-radius:inherit;
      pointer-events:none;
      box-shadow:
        inset 0 -22px 28px rgba(0,0,0,.28),
        inset 0   1px  0 rgba(255,255,255,.06);
    }
    .hero-card img{
      width:100%; height:100%;
      object-fit:cover; display:block;
      border-radius:inherit;
    }

    /* 情報カード＋丸アイコン */
    .profile-stack{ position:relative; }
    .avatar{
      position:absolute; inset:-56px 0 auto 50%;
      transform:translateX(-50%);
      width:96px; height:96px; border-radius:50%;
      border:2px solid #ccc; background:#222; object-fit:cover;
      box-shadow:0 8px 18px rgba(0,0,0,.4);
      z-index:2;
    }

    /* メタリックな均等太さの枠：左シルバー→右背景色へ */
    .info-card{
      position:relative; z-index:1;
      padding:var(--pad-y) var(--pad-x);
      border-radius:var(--panel-radius);
      border:2px solid transparent;
      background:
        linear-gradient(160deg, #1a1a1a 0%, #0f0f0f 60%, #1e1e1e 100%) padding-box,
        linear-gradient(90deg, #f0f0f0 0%, #d3d3d3 35%, #2a2a2a 100%) border-box;
      background-clip: padding-box, border-box;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 18px 38px rgba(0,0,0,.5);
      overflow:hidden;
    }

    /* ラベル（左）→値（右）を別行で */
    .row{ margin: var(--row-gap) 0; }
    .label{
      display:block; text-align:left;
      font-family: "Poppins", ui-sans-serif;
      font-size: var(--label-size); font-weight: 700;
      color:#eaeaea; letter-spacing:.02em;
      margin-bottom:6px;
    }
    .value{
      display:block; text-align:right;
      font-family: "Inter", ui-sans-serif;
      font-size: var(--value-size); font-weight: 600;
      color:#fff; letter-spacing:.02em;
    }
    .mono{ font-variant-numeric: tabular-nums; letter-spacing:.04em; }

    @media (max-width:360px){
      :root{
        --label-size: 17px;
        --value-size: 16px;
        --row-gap:   16px;
        --pad-x:     18px;
        --pad-y:     20px;
      }
      .avatar{ inset:-48px 0 auto 50%; width:86px; height:86px; }
      .container{ padding-inline:12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img id="logo" class="logo" alt="Logo">

    <div class="hero-card">
      <img id="heroImg" alt="Membership Card">
    </div>

    <div class="profile-stack">
      <img id="avatar" class="avatar" alt="Profile">
      <div class="info-card">
        <div class="row">
          <div class="label">Member ID</div>
          <div id="serialValue" class="value mono">#00000</div>
