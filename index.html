<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
  import {
    getFirestore, collection, doc, runTransaction, query, where, getDocs, Timestamp
  } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

  // ==== Firebase Storage 公開URL ====
  const LOGO_URL = "https://firebasestorage.googleapis.com/v0/b/openworld-liff.firebasestorage.app/o/Frame%206.png?alt=media&token=a744ed7e-1016-49ed-ae95-aa6d97ccf12e";
  const CARD_IMAGE_URL = "https://firebasestorage.googleapis.com/v0/b/openworld-liff.firebasestorage.app/o/Card.png?alt=media&token=2b4be783-84b7-4dd7-aed1-199d0172617c";
  // ==================================

  const firebaseConfig = {
    apiKey: "AIzaSyDwqG7to68d7O9KQ2EPWaUD1UFm_Cq9HXo",
    authDomain: "openworld-liff.firebaseapp.com",
    projectId: "openworld-liff",
    storageBucket: "openworld-liff.appspot.com",
    messagingSenderId: "79997022356",
    appId: "1:79997022356:web:89e7081d808bc5fc418481",
    measurementId: "G-SRK6BVFDYN"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ロゴとカード画像をセット
  document.getElementById("logo").src = LOGO_URL;
  document.getElementById("heroImg").src = CARD_IMAGE_URL;

  function pad4(n){ return String(n).padStart(5, "0"); }
  function fmtDate(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}/${m}/${day}`;
  }
  function toDateMaybe(ts){
    if (!ts) return null;
    if (ts instanceof Date) return ts;
    if (typeof ts === "string") {
      const d = new Date(ts);
      return isNaN(d) ? null : d;
    }
    if (typeof ts === "object" && "seconds" in ts) {
      return new Date(ts.seconds * 1000);
    }
    try { return Timestamp.fromDate(ts).toDate(); } catch { return null; }
  }

  async function main(){
    await liff.init({ liffId: "2007741116-ljZP4eGp" });
    if (!liff.isLoggedIn()) { liff.login(); return; }

    const profile = await liff.getProfile();
    const userId = profile.userId;

    const membersRef = collection(db, "members");
    const qExist = query(membersRef, where("userId", "==", userId));
    const existSnap = await getDocs(qExist);

    if (existSnap.empty){
      const counterRef = doc(db, "counters", "members");
      await runTransaction(db, async (tx) => {
        const c = await tx.get(counterRef);
        let last = 0;
        if (!c.exists()) {
          tx.set(counterRef, { lastSerial: 0 });
        } else {
          last = c.data().lastSerial || 0;
        }
        const newSerial = last + 1;
        tx.update(counterRef, { lastSerial: newSerial });
        const newMemberRef = doc(membersRef);
        tx.set(newMemberRef, {
          userId,
          displayName: profile.displayName ?? "",
          pictureUrl: profile.pictureUrl ?? "",
          registeredAt: new Date(),
          memberNo: newSerial,
        });
      });
    }

    const snap = await getDocs(query(membersRef, where("userId","==", userId)));
    if (snap.empty){ alert("ユーザー情報が見つかりません"); return; }
    const data = snap.docs[0].data();

    document.getElementById("serial").textContent = `#${pad4(data.memberNo ?? 0)}`;
    document.getElementById("name").textContent = data.displayName ?? profile.displayName ?? "—";
    const d = toDateMaybe(data.registeredAt);
    document.getElementById("date").textContent = d ? fmtDate(d) : "—";
    document.getElementById("avatar").src = (data.pictureUrl || profile.pictureUrl || "");
  }

  main();
</script>
