<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>OpenWorld 会員証</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- フォント -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Krona+One&display=swap" rel="stylesheet">

  <style>
    :root{
      --panel-radius: 18px;
      --label-value-gap: 12px;

      /* 基本の3点間隔（上端→ロゴ、ロゴ→カード、カード下端→アバター上端の見た目） */
      --space: 24px;

      /* アバターが下カードに食い込む量（見た目のため） */
      --avatar-overlap: 56px;

      /* 画像の見え方補正（ロゴ/カードの“視覚的な高さ”差を吸収） */
      --logo-adjust: 6px;
      --card-adjust: -4px;

      /* カードだけ上に持ち上げる量（負で上へ） */
      --card-nudge: -18px;

      /* ▼ロゴの“左ズレ”補正（負で左へ、正で右へ） */
      --logo-left-nudge: -20px;
    }

    *{ box-sizing: border-box; }
    body{
      margin:0;
      font-family: system-ui, sans-serif;
      color:#fff;
      min-height:100svh;
      background: radial-gradient(1200px 700px at 50% -200px, #7a7a7a 0%, #535353 40%, #2e2e2e 100%);
      background-attachment: fixed;
      display:flex; justify-content:center; align-items:flex-start;
    }
    .container{
      width:100%;
      max-width:460px;
      padding: var(--space) 16px 100px; /* 上端→ロゴの間隔 = --space */
      position:relative;
    }

    /* ロゴ（カードと同じ左端へ） */
    .logo{
      display:block;
      width:100%;        /* ←カードと同じくコンテナ幅いっぱい */
      max-width:100%;
      height:auto;
      pointer-events:none;
      user-select:none;

      /* 左端そろえ微調整（画像側に透明余白がある場合用） */
      margin-left: var(--logo-left-nudge);

      /* ロゴ→カードの見た目の間隔 = --space（補正込み） */
      margin-bottom: calc(var(--space) + var(--logo-adjust));
    }

    /* 上部カード */
    .hero-card{
      position:relative;
      width:100%;
      aspect-ratio:16/9;
      border-radius:16px;
      overflow:hidden;
      background:#000;
      box-shadow: 0 18px 50px rgba(0,0,0,.38),
                  0  8px 20px rgba(0,0,0,.32),
                  0  2px  6px rgba(0,0,0,.25);
      margin-top: var(--card-nudge);
      margin-bottom: calc(
        var(--space) + var(--card-adjust) + var(--avatar-overlap) - var(--card-nudge)
      );
    }
    .hero-card img{
      width:100%; height:100%;
      object-fit:cover; display:block;
      border-radius:inherit;
    }

    /* プロフィール */
    .profile-stack{ position:relative; }
    .avatar{
      position:absolute;
      inset: calc(-1 * var(--avatar-overlap)) 0 auto 50%;
      transform:translateX(-50%);
      width:96px; height:96px; border-radius:50%;
      border:2px solid #ccc;
      background:#222;
      object-fit:cover;          /* 四角画像でも綺麗に丸く見せる */
      object-position: 50% 50%;  /* 必要なら 50% 40% などで微調整 */
      box-shadow:0 8px 18px rgba(0,0,0,.4);
      z-index:2;
    }

    /* 情報カード */
    .info-card{
      position:relative; z-index:1;
      padding:24px 22px;
      border-radius:var(--panel-radius);
      border:2px solid transparent;
      background:
        linear-gradient(160deg, #1a1a1a 0%, #0f0f0f 60%, #1e1e1e 100%) padding-box,
        linear-gradient(90deg, #f0f0f0 0%, #d3d3d3 35%, #2a2a2a 100%) border-box;
      background-clip: padding-box, border-box;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05),
                  0 18px 38px rgba(0,0,0,.5);
      overflow:hidden;
    }

    .row{ margin:22px 0; }

    .label{
      display:block;
      text-align:left;
      font-family: "Krona One", sans-serif;
      font-size:17px;
      font-weight:400;
      color:#eaeaea;
      margin-bottom: var(--label-value-gap);
    }

    .value{
      display:block;
      text-align:right;
      font-family: "Inter", sans-serif;
      font-size:17px;
      font-weight:400;
      color:#fff;
    }

    @media (max-width:360px){
      :root{
        --label-value-gap: 14px;
        --space: 20px;
        --avatar-overlap: 48px;
        --logo-adjust: 4px;
        --card-adjust: -2px;
        --card-nudge: -6px;
        --logo-left-nudge: 0px; /* 必要なら -2px などに */
      }
      .container{ padding: calc(var(--space) + 20px) 12px 80px; }
      .avatar{ width:86px; height:86px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img id="logo" class="logo" alt="Logo">

    <div class="hero-card">
      <img id="heroImg" alt="Membership Card">
    </div>

    <div class="profile-stack">
      <img id="avatar" class="avatar" alt="Profile">
      <div class="info-card">
        <div class="row">
          <div class="label">Member ID</div>
          <div id="serialValue" class="value">#00000</div>
        </div>
        <div class="row">
          <div class="label">Name</div>
          <div id="nameValue" class="value">—</div>
        </div>
        <div class="row">
          <div class="label">Join Date</div>
          <div id="dateValue" class="value">—</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import {
      getFirestore, collection, doc, runTransaction,
      query, where, getDocs, Timestamp, updateDoc
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    const LOGO_URL = "https://firebasestorage.googleapis.com/v0/b/openworld-liff.firebasestorage.app/o/Header.png?alt=media&token=44229293-82db-4a55-bef3-c656bb9e7845";
    const CARD_IMAGE_URL = "https://firebasestorage.googleapis.com/v0/b/openworld-liff.firebasestorage.app/o/Group%205.png?alt=media&token=d9d885a4-7dd5-4a21-8bc0-ec248a39d3a2";

    // デフォルトアバター（四角でもOK、CSSで丸表示）
    const DEFAULT_AVATAR_URL = "https://firebasestorage.googleapis.com/v0/b/openworld-liff.firebasestorage.app/o/%E3%82%B9%E3%82%AF%E3%83%AA%E3%83%BC%E3%83%B3%E3%82%B7%E3%83%A7%E3%83%83%E3%83%88%202025-08-30%20032839.png?alt=media&token=cc26ae94-7e9a-49ae-9566-591133911527";

    const firebaseConfig = {
      apiKey: "AIzaSyDwqG7to68d7O9KQ2EPWaUD1UFm_Cq9HXo",
      authDomain: "openworld-liff.firebaseapp.com",
      projectId: "openworld-liff",
      storageBucket: "openworld-liff.appspot.com",
      messagingSenderId: "79997022356",
      appId: "1:79997022356:web:89e7081d808bc5fc418481",
      measurementId: "G-SRK6BVFDYN"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("logo").src = LOGO_URL;
    document.getElementById("heroImg").src = CARD_IMAGE_URL;

    const pad5 = n => String(n ?? 0).padStart(5,"0");
    const fmtYMD = d => {
      const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
      return `${y}/${m}/${day}`;
    };

    function toDateMaybe(ts){
      if (!ts) return null;
      if (ts instanceof Date) return ts;
      if (typeof ts==="string"){ const d=new Date(ts); return isNaN(d)?null:d; }
      if (typeof ts==="object" && "seconds" in ts){ return new Date(ts.seconds*1000); }
      try{ return Timestamp.fromDate(ts).toDate(); }catch{ return null; }
    }

    async function main(){
      await liff.init({ liffId:"2007741116-ljZP4eGp" });
      if(!liff.isLoggedIn()){ liff.login(); return; }

      const profile = await liff.getProfile();
      const userId = profile.userId;

      const membersRef = collection(db,"members");
      const qExist = query(membersRef, where("userId","==", userId));
      const existSnap = await getDocs(qExist);

      // 初回登録（memberが無い時）
      if(existSnap.empty){
        const counterRef = doc(db,"counters","members");
        await runTransaction(db, async(tx)=>{
          const c=await tx.get(counterRef);
          let last=0;
          if(!c.exists()) tx.set(counterRef,{ lastSerial:0 });
          else last=c.data().lastSerial||0;

          const newSerial=last+1;
          tx.update(counterRef,{ lastSerial:newSerial });

          const newMemberRef=doc(membersRef);
          tx.set(newMemberRef,{
            userId,
            displayName: profile.displayName ?? "",
            pictureUrl: profile.pictureUrl || null, // 空文字でなくnull推奨
            registeredAt:new Date(),
            memberNo:newSerial,
          });
        });
      }

      // 再取得（上の登録直後含む）
      const snap=await getDocs(query(membersRef, where("userId","==", userId)));
      if(snap.empty){ alert("ユーザー情報が見つかりません"); return; }
      const docRef = snap.docs[0].ref;
      const data=snap.docs[0].data();

      // ★ A案：LIFFの最新を常に優先表示
      const latestPhoto = profile.pictureUrl || null;
      const storedPhoto = data.pictureUrl || null;
      const chosenPhoto = latestPhoto || storedPhoto || DEFAULT_AVATAR_URL;

      const avatarEl = document.getElementById("avatar");
      // キャッシュ強い場合は下行のコメントを外す（軽いキャッシュバスター）
      // const cacheBusted = chosenPhoto + ((chosenPhoto.includes("?") ? "&" : "?") + "t=" + Date.now());
      // avatarEl.src = cacheBusted;
      avatarEl.src = chosenPhoto;

      avatarEl.onerror = () => {
        if (avatarEl.src !== DEFAULT_AVATAR_URL) {
          avatarEl.src = DEFAULT_AVATAR_URL;
        }
      };

      // 名前も最新を優先
      const latestName = profile.displayName || data.displayName || "";
      document.getElementById("nameValue").textContent = latestName || "—";
      document.getElementById("serialValue").textContent=`#${pad5(data.memberNo)}`;
      const d=toDateMaybe(data.registeredAt);
      document.getElementById("dateValue").textContent=d?fmtYMD(d):"—";

      // ★ Firestoreへ差分があれば追従更新（画像・名前）
      const updates = {};
      if (latestPhoto && latestPhoto !== storedPhoto) updates.pictureUrl = latestPhoto;
      if ((data.displayName || "") !== latestName) updates.displayName = latestName;
      if (Object.keys(updates).length) {
        await updateDoc(docRef, updates);
      }
    }

    main().catch(e=>{
      console.error(e);
      alert("初期化に失敗しました。LINEアプリ内で開いているか確認してください。");
    });
  </script>
</body>
</html>
