<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>OpenWorld 会員証</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #f0f0f0;
    }
    .card-container {
      position: relative;
      max-width: 430px;
      margin: 0 auto;
    }
    .card-bg {
      width: 100%;
      display: block;
    }
    .card-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      padding: 20px;
      box-sizing: border-box;
      color: #000;
      text-shadow: 1px 1px 2px #fff;
    }
    /* 左上ロゴ */
    .logo-img{
      position: absolute;
      top: 14px; left: 14px;
      width: 160px;
      height: auto;
      display: block;
      pointer-events: none;
      user-select: none;
    }
    .card-overlay h1 {
      font-size: 20px;
      margin: 10px 0;
      font-weight: bold;
      padding-left: 0; /* ロゴと重ならない位置に調整する場合はここを変更 */
      visibility: hidden; /* タイトルを非表示に（ロゴに置き換え） */
      height: 0;
      margin: 0;
    }
    .info-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-top: 64px; /* ロゴ分の上余白 */
    }
    .info-text { flex: 1; }
    .info-text p {
      margin: 5px 0;
      font-size: 16px;
    }
    .profile-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="card-container">
    <!-- カード画像（背景） -->
    <img
      id="cardBg"
      class="card-bg"
      src=""
      alt="背景画像"
    />

    <!-- オーバーレイ（ロゴ＋テキスト） -->
    <div class="card-overlay">
      <!-- 左上ロゴ -->
      <img id="logo" class="logo-img" alt="Logo">
      <h1>OpenWorld 会員証</h1>

      <div class="info-row">
        <div class="info-text">
          <p id="serial">会員証 No: 取得中...</p>
          <p id="name">名前: 取得中...</p>
          <p id="timestamp">登録日時: 取得中...</p>
        </div>
        <img id="profileImg" class="profile-img" src="" alt="プロフィール画像">
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import {
      getFirestore, collection, doc, runTransaction, query, where, getDocs, Timestamp
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    // ==== Firebase Storage 公開URL（あなたがくれたURL） ====
    const LOGO_URL = "https://firebasestorage.googleapis.com/v0/b/openworld-liff.firebasestorage.app/o/Frame%206.png?alt=media&token=a744ed7e-1016-49ed-ae95-aa6d97ccf12e";
    const CARD_IMAGE_URL = "https://firebasestorage.googleapis.com/v0/b/openworld-liff.firebasestorage.app/o/Card.png?alt=media&token=2b4be783-84b7-4dd7-aed1-199d0172617c";
    // =====================================================

    const firebaseConfig = {
      apiKey: "AIzaSyDwqG7to68d7O9KQ2EPWaUD1UFm_Cq9HXo",
      authDomain: "openworld-liff.firebaseapp.com",
      projectId: "openworld-liff",
      storageBucket: "openworld-liff.appspot.com",
      messagingSenderId: "79997022356",
      appId: "1:79997022356:web:89e7081d808bc5fc418481",
      measurementId: "G-SRK6BVFDYN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // DOMの準備ができてから実行（未定義要素アクセスで落ちないように）
    window.addEventListener("DOMContentLoaded", () => {
      const logoEl = document.getElementById("logo");
      if (logoEl) logoEl.src = LOGO_URL;

      const bgEl = document.getElementById("cardBg");
      if (bgEl) bgEl.src = CARD_IMAGE_URL;

      main().catch(err => {
        console.error(err);
        alert("初期化で問題が発生しました。コンソールを確認してください。");
      });
    });

    function pad5(n){ return String(n ?? 0).padStart(5, "0"); }
    function fmtDate(d){
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const day = String(d.getDate()).padStart(2,"0");
      const hh = String(d.getHours()).padStart(2,"0");
      const mm = String(d.getMinutes()).padStart(2,"0");
      return `${y}/${m}/${day} ${hh}:${mm}`;
    }
    function toDateMaybe(ts){
      if (!ts) return null;
      if (ts instanceof Date) return ts;
      if (typeof ts === "string") {
        const d = new Date(ts);
        return isNaN(d) ? null : d;
      }
      if (typeof ts === "object" && "seconds" in ts) {
        return new Date(ts.seconds * 1000);
      }
      try { return Timestamp.fromDate(ts).toDate(); } catch { return null; }
    }

    async function main(){
      await liff.init({ liffId: "2007741116-ljZP4eGp" });
      if (!liff.isLoggedIn()) { liff.login(); return; }

      const profile = await liff.getProfile();
      const userId = profile.userId;

      const membersRef = collection(db, "members");
      const qExist = query(membersRef, where("userId", "==", userId));
      const existSnap = await getDocs(qExist);

      // 初回登録：連番払い出し
      if (existSnap.empty){
        const counterRef = doc(db, "counters", "members");
        await runTransaction(db, async (tx) => {
          const c = await tx.get(counterRef);
          let last = 0;
          if (!c.exists()) {
            tx.set(counterRef, { lastSerial: 0 });
          } else {
            last = c.data().lastSerial || 0;
          }
          const newSerial = last + 1;
          tx.update(counterRef, { lastSerial: newSerial });
          const newMemberRef = doc(membersRef);
          tx.set(newMemberRef, {
            userId,
            displayName: profile.displayName ?? "",
            pictureUrl: profile.pictureUrl ?? "",
            registeredAt: new Date(),
            memberNo: newSerial,
          });
        });
      }

      // 再取得して画面へ反映
      const snap = await getDocs(query(membersRef, where("userId","==", userId)));
      if (snap.empty){ alert("ユーザー情報が見つかりません"); return; }
      const data = snap.docs[0].data();

      const serialEl = document.getElementById("serial");
      if (serialEl) serialEl.innerText = `会員証 No: #${pad5(data.memberNo)}`;

      const nameEl = document.getElementById("name");
      if (nameEl) nameEl.innerText = `名前: ${data.displayName ?? profile.displayName ?? "—"}`;

      const tsEl = document.getElementById("timestamp");
      if (tsEl) {
        const d = toDateMaybe(data.registeredAt);
        tsEl.innerText = `登録日時: ${d ? fmtDate(d) : "—"}`;
      }

      const avatarEl = document.getElementById("profileImg");
      if (avatarEl) avatarEl.src = (data.pictureUrl || profile.pictureUrl || "");
    }
  </script>
</body>
</html>
